name: 'Snowflake Query Action'
author: 'anecdotes.ai'
description: 'This action lets running a list of SQL queries on your Snowflake DB.'

branding:
  icon: 'database'
  color: 'blue'

inputs:
  snowflake_username:
    description: 'Username for Snowflake DB'
    required: true
  snowflake_password:
    description: 'Password for Snowflake DB. Optional — supply this or snowflake_private_key.
      Snowflake removes password auth for service users around October 2026; prefer the key.'
    required: false
  snowflake_private_key:
    description: 'Unencrypted PKCS#8 private key (contents of rsa_key.p8) for key-pair auth.
      Takes precedence over snowflake_password. Real newlines or literal \n escapes both work.'
    required: false
  snowflake_account:
    description: 'Account name for Snowflake DB. Your account name is the full/entire string to the left of snowflakecomputing.com.'
    required: true
  snowflake_warehouse:
    description: 'Warehouse as context'
    required: true
  snowflake_role:
    description: 'Set user role'
    required: false
  queries:
    description: 'List of SQL queries, seperated by ;'
    required: true
  sync:
    description: 'Whether to run the queries sync (default is async)'
    required: false

outputs:
  queries_results:
    description: 'Json encoded as base64, containing all queries results'
    
runs:
  using: 'docker'
  image: 'Dockerfile'